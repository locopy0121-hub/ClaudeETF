name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # 1.1 版的修訂號從 1 起算：第 177 次建置 = 1.1.1，之後每次 +1（1.0.1–1.0.78 為第 99–176 次）
      - name: Version
        run: |
          echo "MINOR=1" >> "$GITHUB_ENV"
          echo "PATCH=$(( ${{ github.run_number }} - 176 ))" >> "$GITHUB_ENV"

      # 先跑單元測試（金額捨去、升降單位、K 線分析），失敗就不發布
      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew testReleaseUnitTest --stacktrace

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        id: apk
        run: |
          NAME="ClaudeETF-v1.${{ env.MINOR }}.${{ env.PATCH }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeETF-v1.${{ env.MINOR }}.${{ env.PATCH }}
          path: ${{ steps.apk.outputs.name }}

      # 每次推送都會建置與測試；只有 commit 訊息含「[發布]」時才發布（約每五個階段發布一次）。
      # 更新說明：彙整上次發布以來所有階段的 commit 訊息，去掉署名行與 [發布] 標記
      - name: Release notes
        if: contains(github.event.head_commit.message, '[發布]')
        run: |
          LAST=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          RANGE=${LAST:+$LAST..}HEAD
          git log --reverse --format='%B%n' $RANGE | grep -vE '^(Co-Authored-By|Claude-Session):' | sed 's/ *\[發布\]//' | cat -s > notes.md
          printf '\n---\n版本 1.%s.%s（建置 #%s）\n下載下方 APK 直接安裝；簽章固定，可直接覆蓋更新。App 內「設置 › 關於 › 檢查更新」可線上更新。\n' "${{ env.MINOR }}" "${{ env.PATCH }}" "${{ github.run_number }}" >> notes.md

      # 發布到 Releases，手機直接下載安裝；App 內線上更新也從這裡取得
      - uses: softprops/action-gh-release@v2
        if: contains(github.event.head_commit.message, '[發布]')
        with:
          tag_name: v1.${{ env.MINOR }}.${{ env.PATCH }}
          name: ClaudeETF v1.${{ env.MINOR }}.${{ env.PATCH }}
          prerelease: false
          make_latest: true
          body_path: notes.md
          files: ${{ steps.apk.outputs.name }}
