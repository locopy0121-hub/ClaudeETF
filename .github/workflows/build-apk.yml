name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # 1.0 版的修訂號從 1 起算：第 99 次建置 = 1.0.1，之後每次 +1
      - name: Version
        run: echo "PATCH=$(( ${{ github.run_number }} - 98 ))" >> "$GITHUB_ENV"

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        id: apk
        run: |
          NAME="ClaudeETF-v1.0.${{ env.PATCH }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeETF-v1.0.${{ env.PATCH }}
          path: ${{ steps.apk.outputs.name }}

      # 發布到 Releases，手機直接下載安裝；App 內線上更新也從這裡取得
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ env.PATCH }}
          name: ClaudeETF v1.0.${{ env.PATCH }}
          prerelease: false
          make_latest: true
          body: |
            ${{ github.event.head_commit.message }}

            ---
            版本 1.0.${{ env.PATCH }}（建置 #${{ github.run_number }}）
            commit: ${{ github.sha }}
            下載下方 APK 直接安裝；簽章固定，可直接覆蓋更新。App 內「我的 › 關於 › 檢查更新」可線上更新。
          files: ${{ steps.apk.outputs.name }}
